<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Management — Till Recorder</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520;9..144,640&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="desk.css">
</head>
<body>
  <header class="top">
    <a class="mark" href="index.html">Till<span class="dot" aria-hidden="true"></span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="watch.html">Owner watch</a>
      <button id="lock" class="quiet" type="button" hidden>Lock</button>
    </nav>
  </header>
  <main id="app" class="stack">
    <p class="lede">Owner</p>
    <h1>Management</h1>
    <form id="gate" class="panel" style="max-width: 460px;">
      <p class="note">This page uses the existing owner token. Google accounts cannot open it.</p>
      <label for="token">Owner token</label>
      <input id="token" type="password" autocomplete="current-password" required>
      <p id="gateError" class="error" hidden></p>
      <div class="row" style="margin-top: 14px;">
        <button type="submit">Open management</button>
      </div>
    </form>
  </main>
  <script src="management.js"></script>
</body>
</html>
